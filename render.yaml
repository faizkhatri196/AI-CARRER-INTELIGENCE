services:
  - type: web
    name: ai-career-intelligence-backend
    env: python
    rootDir: backend
    buildCommand: pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
